<!DOCTYPE html>
<html lang="ja" data-easy="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="中小企業の事務の下書きをAIが作り、人が押して確定するデモ画面。株式会社気持ち市場。">
<title>帳場（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   帳場（ちょうば） — 番頭デモ スタイル
   気持ち市場ハウススタイル準拠：見出し明朝／濃紺×生成り／金はアクセント1色
   角丸ゼロ・影ゼロ。構造は罫線と余白で作る。
   ========================================================================== */

:root {
  /* 紙と墨 */
  --paper:      #f6f3ee;   /* 生成り＝帳面の紙 */
  --paper-2:    #fffdf9;   /* カードの面 */
  --paper-3:    #efeae1;   /* 沈んだ面（見出し帯・空状態） */
  --sumi:       #0e1b2a;   /* 濃紺＝墨 */
  --sumi-2:     #33404e;   /* 弱い文字 */
  --sumi-3:     #6b7684;   /* 補足 */
  --rule:       #ddd6cb;   /* 罫 */
  --rule-2:     #c9c0b2;   /* 濃い罫 */

  /* 差し色は2つだけ */
  --kin:        #c8934a;   /* 金＝当社のアクセント */
  --shu:        #9b2c1c;   /* 朱＝お金・社外に出るもの */
  --shu-bg:     #fbf1ee;
  --midori:     #1f5b3a;   /* 済み・通ったもの */

  /* 寸法 */
  --tap:        48px;      /* 押す場所の最小の高さ */
  --gap:        8px;       /* 押す場所どうしの最小の間隔 */
  --body:       16px;
  --line:       1.75;
  --rail:       236px;

  --mincho: "Noto Serif JP", "游明朝", YuMincho, "Hiragino Mincho ProN", "MS P明朝", serif;
  --gothic: "Noto Sans JP", "游ゴシック体", YuGothic, "游ゴシック", "Hiragino Sans", "Meiryo", sans-serif;
}

/* らくらく表示：文字とボタンを大きく、線を濃く */
:root[data-easy="on"] {
  --body: 20px;
  --tap: 64px;
  --rule: #c9c0b2;
  --rule-2: #a89c88;
  --sumi-3: #4c5866;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--sumi);
  font-family: var(--gothic);
  font-size: var(--body);
  line-height: var(--line);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt" 1;
}

/* 紙の目。うるさくならない程度に */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
  background-image:
    repeating-linear-gradient(0deg, rgba(14,27,42,.014) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(14,27,42,.010) 0 1px, transparent 1px 4px);
}

h1, h2, h3, .mincho { font-family: var(--mincho); font-weight: 600; letter-spacing: .02em; }

button, input, select, textarea { font: inherit; color: inherit; }

.num { font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* ==========================================================================
   全体の骨組み
   ========================================================================== */

.shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---- 左の縦メニュー：5項目だけ ---- */
.rail {
  background: var(--sumi);
  color: var(--paper);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--sumi);
}

.rail-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid rgba(246,243,238,.14);
}
.rail-brand .mark {
  font-family: var(--mincho);
  font-size: 21px;
  line-height: 1.3;
  color: var(--paper);
}
.rail-brand .sub {
  margin-top: 4px;
  font-size: 11px;
  letter-spacing: .12em;
  color: rgba(246,243,238,.55);
}

.rail-nav { padding: 10px 0; flex: 1; }

.rail-item {
  position: relative;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: var(--tap);
  padding: 10px 18px;
  background: none;
  border: 0;
  border-left: 3px solid transparent;
  color: rgba(246,243,238,.78);
  text-align: left;
  cursor: pointer;
  transition: background .12s linear, color .12s linear;
}
.rail-item .kanji {
  font-family: var(--mincho);
  font-size: 19px;
  color: rgba(246,243,238,.5);
  text-align: center;
  transition: color .12s linear;
}
.rail-item .label { font-size: 14px; line-height: 1.35; }
.rail-item .label small { display: block; font-size: 11px; color: rgba(246,243,238,.45); }

.rail-item:hover { background: rgba(246,243,238,.06); color: var(--paper); }
.rail-item:focus-visible { outline: 2px solid var(--kin); outline-offset: -2px; }
.rail-item[aria-current="true"] {
  background: rgba(246,243,238,.10);
  border-left-color: var(--kin);
  color: var(--paper);
}
.rail-item[aria-current="true"] .kanji { color: var(--kin); }

.rail-count {
  margin-left: auto;
  font-size: 12px;
  color: var(--sumi);
  background: var(--kin);
  min-width: 22px;
  padding: 0 6px;
  text-align: center;
}

.rail-foot {
  padding: 14px 18px 18px;
  border-top: 1px solid rgba(246,243,238,.14);
  font-size: 11px;
  color: rgba(246,243,238,.5);
}
.rail-foot .role { color: rgba(246,243,238,.8); font-size: 12px; }

/* ---- 上の帯 ---- */
.top {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 28px;
  min-height: 62px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.top .who { font-family: var(--mincho); font-size: 17px; }
.top .who em { font-style: normal; color: var(--kin); }
.top .spacer { flex: 1; }

.ghost {
  min-height: 38px;
  padding: 0 14px;
  background: none;
  border: 1px solid var(--rule-2);
  color: var(--sumi-2);
  cursor: pointer;
  transition: border-color .12s linear, color .12s linear;
}
.ghost:hover { border-color: var(--sumi); color: var(--sumi); }
.ghost:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
.ghost[aria-pressed="true"] { border-color: var(--sumi); background: var(--sumi); color: var(--paper); }

/* ---- 本文 ---- */
.main { min-width: 0; }
.page { max-width: 980px; padding: 30px 28px 96px; }

.page-title {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin: 0 0 4px;
  font-size: 27px;
}
.page-lead { margin: 0 0 26px; color: var(--sumi-3); font-size: 14px; }

/* 大きな連番（ハウススタイル） */
.serial {
  font-family: var(--mincho);
  font-size: 13px;
  letter-spacing: .3em;
  color: var(--kin);
  border-bottom: 1px solid var(--kin);
  padding-bottom: 2px;
}

/* ==========================================================================
   ① 今日の承認箱
   ========================================================================== */

.today {
  display: flex;
  align-items: flex-end;
  gap: 18px;
  padding: 18px 22px;
  margin-bottom: 26px;
  background: var(--sumi);
  color: var(--paper);
}
.today .kazu {
  font-family: var(--mincho);
  font-size: 54px;
  line-height: 1;
  color: var(--kin);
}
.today .kazu small { font-size: 20px; margin-left: 4px; color: var(--paper); }
.today .say { font-size: 14px; line-height: 1.7; color: rgba(246,243,238,.86); }
.today .say b { color: var(--paper); font-weight: 700; }

.ask {
  display: flex;
  gap: 0;
  margin-bottom: 14px;
  border: 1px solid var(--rule-2);
  background: var(--paper-2);
}
.ask input {
  flex: 1 1 0;
  min-width: 0;          /* これが無いと入力欄が中身の幅を主張して横にはみ出す */
  min-height: var(--tap);
  padding: 0 16px;
  background: none;
  border: 0;
  outline: none;
  font-size: 15px;
}
.ask input::placeholder { color: var(--sumi-3); }
.ask button {
  min-height: var(--tap);
  padding: 0 22px;
  background: var(--sumi);
  color: var(--paper);
  border: 0;
  cursor: pointer;
  font-family: var(--mincho);
}
.ask button:hover { background: #16293c; }

.chips { display: flex; flex-wrap: wrap; gap: var(--gap); margin-bottom: 28px; }
.chip {
  min-height: 40px;
  padding: 0 14px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  color: var(--sumi-2);
  cursor: pointer;
  font-size: 13px;
  transition: border-color .12s linear, background .12s linear;
}
.chip:hover { border-color: var(--sumi-2); background: #fff; }
.chip:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }

.stack { display: flex; flex-direction: column; gap: 14px; }

/* ---- 承認カード ---- */
.card {
  position: relative;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--rule-2);
  overflow: hidden;
}
.card[data-risk="gray"]  { border-left-color: var(--rule-2); }
.card[data-risk="white"] { border-left-color: var(--sumi-2); }
.card[data-risk="red"]   { border-left-color: var(--shu); }
.card[data-done="1"]     { background: var(--paper-3); }

/* 押した札は畳む。今日の残りが目で減っていくようにする */
.card[data-done="1"] .four,
.card[data-done="1"] .diff,
.card[data-done="1"] .trace,
.card[data-done="1"] .need { display: none; }
.card[data-done="1"] .card-top { border-bottom: 0; padding-right: 78px; }
.card[data-done="1"] .card-top h3 { color: var(--sumi-2); }
.card[data-done="1"] .acts { padding-top: 0; }
.card[data-done="1"] .stamp {
  top: 8px; right: 12px; width: 58px; height: 58px; font-size: 12px; border-width: 2px;
}

.stack-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 30px 0 -2px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mincho);
  font-size: 14px;
  color: var(--sumi-3);
  letter-spacing: .1em;
}

.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule);
}
.tag {
  font-size: 11px;
  letter-spacing: .08em;
  padding: 3px 8px;
  border: 1px solid var(--rule-2);
  color: var(--sumi-3);
}
.card[data-risk="red"] .tag.risk { border-color: var(--shu); color: var(--shu); background: var(--shu-bg); }
.card[data-risk="white"] .tag.risk { border-color: var(--sumi-2); color: var(--sumi); }
.card-top h3 { margin: 0; font-size: 17px; flex: 1; min-width: 0; }

/* 何を・いくら・誰に・いつまでに */
.four {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: 0;
  padding: 4px 18px 12px;
}
.four dt {
  padding: 9px 0;
  font-size: 13px;
  color: var(--sumi-3);
  border-bottom: 1px dotted var(--rule);
}
.four dd {
  margin: 0;
  padding: 9px 0;
  font-size: 15px;
  border-bottom: 1px dotted var(--rule);
}
.four dd.money { font-family: var(--mincho); font-size: 19px; }
.four dt:last-of-type, .four dd:last-of-type { border-bottom: 0; }

/* 差分 */
.diff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-top: 1px solid var(--rule); }
.diff > div { padding: 14px 18px; font-size: 13px; line-height: 1.7; }
.diff .from { background: var(--paper-3); color: var(--sumi-2); border-right: 1px solid var(--rule); }
.diff .to { background: var(--paper-2); }
.diff .cap {
  display: block;
  margin-bottom: 6px;
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--sumi-3);
}
.diff .to .cap { color: var(--kin); }

/* 3行の足あと（2行目＝できなかったこと） */
.trace { list-style: none; margin: 0; padding: 12px 18px; border-top: 1px solid var(--rule); }
.trace li {
  position: relative;
  padding-left: 26px;
  font-size: 13px;
  color: var(--sumi-2);
  line-height: 1.9;
}
.trace li::before {
  content: attr(data-n);
  position: absolute;
  left: 0;
  top: 0;
  font-family: var(--mincho);
  font-size: 12px;
  color: var(--sumi-3);
}
.trace li[data-skip="1"] { color: var(--shu); }
.trace li[data-skip="1"]::before { color: var(--shu); }

.need {
  margin: 0 18px 14px;
  padding: 10px 14px;
  background: var(--shu-bg);
  border-left: 3px solid var(--shu);
  font-size: 13px;
  color: #6d2115;
}
.need b { font-family: var(--mincho); }

/* 3つのボタン */
.acts { display: flex; gap: var(--gap); padding: 0 18px 18px; flex-wrap: wrap; }
.btn {
  min-height: var(--tap);
  padding: 0 24px;
  border: 1px solid var(--sumi);
  background: var(--sumi);
  color: var(--paper);
  cursor: pointer;
  font-size: 15px;
  transition: background .12s linear, color .12s linear;
}
.btn:hover { background: #16293c; }
.btn:active { background: #091320; }
.btn:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
.btn.sub { background: none; color: var(--sumi); }
.btn.sub:hover { background: var(--paper-3); }
.btn[disabled] { border-color: var(--rule-2); background: var(--paper-3); color: var(--sumi-3); cursor: not-allowed; }
.card[data-risk="red"] .btn.go { background: var(--shu); border-color: var(--shu); }
.card[data-risk="red"] .btn.go:hover { background: #822415; }

/* ---- 朱の角印。押した瞬間に落ちる ---- */
.stamp {
  position: absolute;
  top: 14px;
  right: 18px;
  width: 74px;
  height: 74px;
  display: grid;
  place-items: center;
  border: 3px solid var(--shu);
  color: var(--shu);
  font-family: var(--mincho);
  font-size: 15px;
  line-height: 1.15;
  text-align: center;
  letter-spacing: .04em;
  opacity: 0;
  visibility: hidden;      /* 押す前は場所も取らせない（拡大状態で幅を主張するため） */
  transform: scale(2.1) rotate(-16deg);
  pointer-events: none;
}
.card[data-done="1"] .stamp { visibility: visible; }
.card[data-done="1"] .stamp { animation: press .34s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes press {
  0%   { opacity: 0;   transform: scale(2.1) rotate(-16deg); }
  55%  { opacity: .95; transform: scale(.94) rotate(-7deg); }
  100% { opacity: .88; transform: scale(1)   rotate(-7deg); }
}
@media (prefers-reduced-motion: reduce) {
  .card[data-done="1"] .stamp { animation: none; opacity: .88; transform: rotate(-7deg); }
}

/* 空っぽの状態 */
.empty {
  padding: 46px 24px;
  text-align: center;
  background: var(--paper-3);
  border: 1px dashed var(--rule-2);
  color: var(--sumi-3);
}
.empty .big { font-family: var(--mincho); font-size: 21px; color: var(--sumi); display: block; margin-bottom: 6px; }

/* 読み込み中は件数で出す（スピナーは使わない） */
.loading { padding: 18px; border: 1px solid var(--rule); background: var(--paper-2); font-size: 14px; color: var(--sumi-3); }

/* ==========================================================================
   ③ 受け口ボード
   ========================================================================== */

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.pipe {
  padding: 16px 16px 14px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--midori);
  text-align: left;
  cursor: pointer;
  min-height: 128px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color .12s linear;
}
.pipe:hover { border-color: var(--sumi-2); }
.pipe:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
.pipe .nm { font-family: var(--mincho); font-size: 16px; }
.pipe .st { font-size: 12px; color: var(--midori); }
.pipe .ct { margin-top: auto; font-size: 13px; color: var(--sumi-2); }
.pipe .ct b { font-family: var(--mincho); font-size: 20px; }

.pipe[data-st="csv"] { border-top-color: var(--kin); }
.pipe[data-st="csv"] .st { color: #8a6222; }
.pipe[data-st="pending_customer"],
.pipe[data-st="pending_us"],
.pipe[data-st="not_yet"] {
  background: var(--paper-3);
  border-top-color: var(--rule-2);
  color: var(--sumi-3);
}
.pipe[data-st="pending_customer"] .nm,
.pipe[data-st="pending_us"] .nm,
.pipe[data-st="not_yet"] .nm { color: var(--sumi-2); }
.pipe[data-st="pending_customer"] .st,
.pipe[data-st="pending_us"] .st,
.pipe[data-st="not_yet"] .st { color: var(--sumi-3); }

.note {
  margin-top: 22px;
  padding: 16px 18px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--kin);
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--sumi-2);
}
.note b { font-family: var(--mincho); color: var(--sumi); }

/* ==========================================================================
   ④ 今月の1枚
   ========================================================================== */

.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--paper-2); }
.fig { padding: 20px; border-right: 1px solid var(--rule); }
.fig:last-child { border-right: 0; }
.fig .k { font-size: 12px; color: var(--sumi-3); letter-spacing: .06em; }
.fig .v { font-family: var(--mincho); font-size: 38px; line-height: 1.2; }
.fig .v small { font-size: 15px; margin-left: 3px; }
.fig .u { font-size: 12px; color: var(--sumi-3); }

.bars { margin-top: 22px; border: 1px solid var(--rule); background: var(--paper-2); padding: 20px; }
.bar { display: grid; grid-template-columns: 56px minmax(0, 1fr) 64px; align-items: center; gap: 12px; padding: 5px 0; }
.bar .m { font-size: 12px; color: var(--sumi-3); }
.bar .t { height: 14px; background: var(--paper-3); }
.bar .t i { display: block; height: 100%; background: var(--sumi); }
.bar:last-child .t i { background: var(--kin); }
.bar .n { font-size: 13px; text-align: right; }

table.ledger { width: 100%; border-collapse: collapse; margin-top: 22px; background: var(--paper-2); }
table.ledger th, table.ledger td { padding: 11px 14px; border-bottom: 1px solid var(--rule); text-align: left; font-size: 13.5px; }
table.ledger th { background: var(--paper-3); font-family: var(--mincho); font-weight: 600; font-size: 13px; }
table.ledger tr:last-child td { border-bottom: 0; }

.rest {
  margin-top: 26px;
  padding: 22px;
  background: var(--sumi);
  color: var(--paper);
}
.rest .h { font-family: var(--mincho); font-size: 13px; letter-spacing: .18em; color: var(--kin); }
.rest .b { font-family: var(--mincho); font-size: 21px; margin: 8px 0 10px; }
.rest .s { font-size: 13.5px; color: rgba(246,243,238,.8); line-height: 1.85; }

/* ==========================================================================
   設定ドロワー
   ========================================================================== */

.veil { position: fixed; inset: 0; background: rgba(14,27,42,.42); z-index: 40; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(420px, 92vw);
  background: var(--paper);
  border-left: 1px solid var(--rule-2);
  z-index: 41;
  overflow-y: auto;
  padding: 24px;
}
.drawer h2 { margin: 0 0 18px; font-size: 20px; }
.drawer section { padding: 16px 0; border-top: 1px solid var(--rule); }
.drawer .lbl { font-size: 13px; color: var(--sumi-3); margin-bottom: 8px; }
.gyoshu-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.gyoshu-pick button {
  min-height: var(--tap);
  padding: 8px 10px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  cursor: pointer;
  text-align: left;
  font-size: 13.5px;
  display: grid;
  grid-template-columns: 30px 1fr;
  align-items: center;
  gap: 8px;
}
.gyoshu-pick button .kanji { font-family: var(--mincho); font-size: 16px; color: var(--kin); }
.gyoshu-pick button:hover { border-color: var(--sumi-2); }
.gyoshu-pick button[aria-pressed="true"] { background: var(--sumi); color: var(--paper); border-color: var(--sumi); }
.gyoshu-pick button[aria-pressed="true"] .kanji { color: var(--kin); }

/* ==========================================================================
   スマホ（手のひら承認）
   ========================================================================== */

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail {
    position: fixed; bottom: 0; left: 0; right: 0;
    flex-direction: row;
    border-right: 0;
    border-top: 1px solid rgba(246,243,238,.2);
    z-index: 30;
  }
  .rail-brand, .rail-foot { display: none; }
  .rail-nav { display: flex; padding: 0; width: 100%; }
  .rail-item {
    flex: 1;
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 2px;
    padding: 8px 4px;
    border-left: 0;
    border-top: 3px solid transparent;
    text-align: center;
  }
  .rail-item[aria-current="true"] { border-left-color: transparent; border-top-color: var(--kin); }
  .rail-item .label { font-size: 11px; }
  .rail-item .label small { display: none; }
  .rail-count { position: absolute; top: 4px; right: 22%; }

  .top { flex-wrap: wrap; gap: var(--gap); min-height: 0; padding: 10px 16px; }
  .top .who { width: 100%; font-size: 15px; }
  .top .spacer { display: none; }
  .top .ghost { flex: 1 1 0; min-width: 0; }

  .page { padding: 20px 16px 120px; max-width: 100%; }
  .today .kazu { font-size: 44px; }
  .four { grid-template-columns: 74px minmax(0, 1fr); }
  .card-top { flex-wrap: wrap; }
  .card-top h3 { flex-basis: 100%; font-size: 16px; }
  .diff { grid-template-columns: 1fr; }
  .diff .from { border-right: 0; border-bottom: 1px solid var(--rule); }
  .figs { grid-template-columns: 1fr; }
  .fig { border-right: 0; border-bottom: 1px solid var(--rule); }
  .today { flex-direction: column; align-items: flex-start; gap: 8px; }
  .acts { position: sticky; bottom: 64px; background: var(--paper-2); padding-top: 12px; }
  .acts .btn { flex: 1; min-width: 46%; }
}

/* 印刷（商談で紙に出す） */
@media print {
  .rail, .top, .acts, .ask, .chips { display: none; }
  .shell { grid-template-columns: 1fr; }
  .card { break-inside: avoid; }
  body::before { display: none; }
}

    "customer_action": "月に1回、または毎日、機器の画面からCSVを書き出して置いてください。"
   },
   {

    "customer_action": "帰庫したときに、受領書をまとめて撮って置いてください。"
   },
   {
    "name": "Gmail",
    "status": "connected",
    "today_count": "22通",
    "note": "返事の下書きは、この画面と、いつものGmailの下書きフォルダの両方に入ります。送信ボタンはいつものGmailで人が押します。",
    "customer_action": "最初の1回だけ、受信メールを読む許可をご本人の画面で押していただきます。"
   },
   {
    "name": "LINE WORKS",
    "status": "connected",
    "today_count": "9件",
    "note": "現場からの報告の受け取りと、朝の「確認待ちがあります」のお知らせに使います。人数が多いときは順番に送るので、全員に届くまで少し時間がかかります。",
    "customer_action": "LINE WORKSの管理者の方に、当社アプリの登録をしていただきます。"
   },
   {

   {

   {

   {

   },
   {

    "status": "not_yet",
    "today_count": "",

    "customer_action": ""
   }
  ],
  "monthly": {
   "drafts_count": "470件",
   "approved_count": "444件",
   "fixed_count": "34件",
   "remaining_manual": "荷主さんの配車サイトを毎朝ひらいて、明日の便を手で書き写す作業が残っています（3社ぶん・1日およそ25分、平日20日で月およそ8時間20分）。荷主さんごとに画面も様式も違うので、この画面のAIでは片づきません。",
   "upsell_hint": "荷主さんごとの配車の取り込みと、運転者への割り振りまでを作る受託開発が要ります。荷主さんごとに形が違うので、まず1社ぶんから作って、動いてから2社目に広げる進め方になります。同じデータがそろえば、荷主別の採算（どの仕事が儲かっているか）も後から出せます。"
  },
  "legal_notes": [
   "2025年4月の制度改正で日報の保存が要るようになったと聞いています（詳しくは所轄の運輸支局でご確認ください）。制度の中身は国土交通省の原典で確認中のため、当社からは断定してご説明しません。",
   "運転日報は運転者ご本人が確認して確定します。AIが代わりに確定することはしません。中身が実際の運行と違うと、あとで問題になるためです。",
   "位置情報は個人情報です。何のために取るのかを運転者に伝え、ご本人の同意をいただいてからお使いください。",
   "送信・投稿・振込・公開・削除はAIが行いません。人が押します。お金と社外に出るものは、押すまで動きません。社内のメモは押さなくても残ります。",
   "請求・経費の数字は下書きまでです。税務の判断と申告は顧問税理士が行います。当社は税務の相談・代理・書類の作成を行いません。",
   "効果は保証しません。導入実績は0社です。削減時間の数字は、当社が自社で実測して事例を出すまで出しません。",
   "画面に出ている会社名・お名前・金額・件数・時間の数字は、すべて架空のサンプル値です。当社の実測値でも、どこかのお客様の実績でもありません。"
  ]
 }
];

</script>
<script>
/* ==========================================================================
   帳場（ちょうば） — 番頭デモ 本体
   画面は5枚だけ：承認箱／受け口／今月の1枚／設定／気持ち市場に聞く
   データは GYOSHU（業種ごと）と META（商品名など）を外から差し込む
   ========================================================================== */
(function () {
  "use strict";

  /* ---------- 小道具 ---------- */
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function kanjiNum(n) {
    var k = ["〇", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
    if (n <= 10) return k[n];
    if (n < 20) return "十" + k[n - 10];
    return String(n);
  }

  var NAV = [
    { id: "box",    kanji: "承", label: "承認箱",   sub: "今日の決めごと" },
    { id: "pipes",  kanji: "口", label: "受け口",   sub: "つながっている先" },
    { id: "report", kanji: "月", label: "今月の1枚", sub: "件数と残り" },
    { id: "setup",  kanji: "設", label: "設定",     sub: "業種・表示" },
    { id: "ask",    kanji: "問", label: "聞く",     sub: "気持ち市場へ" }
  ];

  var STATE = {
    view: "box",
    gyoshu: 0,
    done: {},      // cardKey -> true
    filter: "",
    drawer: false
  };

  function G() { return window.GYOSHU[STATE.gyoshu]; }
  function cardKey(i) { return G().id + ":" + i; }

  /* 灰＝取り消せる社内メモは最初から通っている扱い（承認疲れを避ける） */
  function autoPass() {
    G().cards.forEach(function (c, i) {
      if (c.risk === "gray") STATE.done[cardKey(i)] = true;
    });
  }

  function pending() {
    return G().cards.filter(function (c, i) {
      return c.risk !== "gray" && !STATE.done[cardKey(i)];
    });
  }

  /* ---------- 左の縦メニュー ---------- */
  function buildRail() {
    var rail = el("nav", "rail");

    var brand = el("div", "rail-brand");
    brand.innerHTML =
      '<div class="mark">' + esc(window.META.name) + "</div>" +
      '<div class="sub">' + esc(window.META.tagline) + "</div>";
    rail.appendChild(brand);

    var nav = el("div", "rail-nav");
    NAV.forEach(function (item) {
      var b = el("button", "rail-item");
      b.type = "button";
      b.setAttribute("aria-current", STATE.view === item.id ? "true" : "false");
      var count = item.id === "box" ? pending().length : 0;
      b.innerHTML =
        '<span class="kanji">' + item.kanji + "</span>" +
        '<span class="label">' + esc(item.label) +
        "<small>" + esc(item.sub) + "</small></span>" +
        (count ? '<span class="rail-count num">' + count + "</span>" : "");
      b.onclick = function () { go(item.id); };
      nav.appendChild(b);
    });
    rail.appendChild(nav);

    var foot = el("div", "rail-foot");
    foot.innerHTML =
      '<div class="role">' + esc(window.META.company) + "</div>" +
      "<div>" + esc(window.META.footnote) + "</div>";
    rail.appendChild(foot);
    return rail;
  }

  /* ---------- 上の帯 ---------- */
  function buildTop() {
    var top = el("div", "top");
    var who = el("div", "who");
    who.innerHTML = "いまの表示：<em>" + esc(G().label) + "</em>";
    top.appendChild(who);
    top.appendChild(el("div", "spacer"));

    var easy = el("button", "ghost");
    easy.type = "button";
    easy.textContent = "らくらく表示";
    var on = document.documentElement.getAttribute("data-easy") === "on";
    easy.setAttribute("aria-pressed", on ? "true" : "false");
    easy.onclick = function () {
      var now = document.documentElement.getAttribute("data-easy") === "on";
      document.documentElement.setAttribute("data-easy", now ? "off" : "on");
      render();
    };
    top.appendChild(easy);

    var st = el("button", "ghost");
    st.type = "button";
    st.textContent = "業種をえらぶ";
    st.onclick = function () { STATE.drawer = true; render(); };
    top.appendChild(st);
    return top;
  }

  /* ==========================================================================
     ① 承認箱
     ========================================================================== */
  function viewBox() {
    var g = G();
    var v = el("div", "page");

    v.appendChild(el("h1", "page-title",
      '<span class="serial">壱</span>' + esc(g.words.approval_box)));
    v.appendChild(el("p", "page-lead", esc(g.tagline)));

    var rest = pending().length;
    var today = el("div", "today");
    today.innerHTML =
      '<div class="kazu mincho">' + kanjiNum(rest) + "<small>件</small></div>" +
      '<div class="say">' + (rest
        ? "夜のうちに下書きを作っておきました。<b>あなたが押すまで、どこにも出ていません。</b><br>上から順に見て、よければ押してください。"
        : "今日の決めごとは終わりました。<b>お疲れさまでした。</b><br>次の下書きは今夜また作っておきます。") +
      "</div>";
    v.appendChild(today);

    var ask = el("div", "ask");
    ask.innerHTML =
      '<input type="text" placeholder="日本語で書いてください（例：' + esc(g.words.partner) + 'への請求）" aria-label="やりたいことを書く">' +
      "<button type=\"button\">さがす</button>";
    var input = ask.querySelector("input");
    input.value = STATE.filter;
    function doFilter() { STATE.filter = input.value.trim(); render(); }
    ask.querySelector("button").onclick = doFilter;
    input.onkeydown = function (e) { if (e.key === "Enter") doFilter(); };
    v.appendChild(ask);

    var kinds = [];
    g.cards.forEach(function (c) { if (kinds.indexOf(c.kind) < 0) kinds.push(c.kind); });
    var chips = el("div", "chips");
    if (STATE.filter) {
      var clr = el("button", "chip");
      clr.type = "button";
      clr.textContent = "しぼり込みをやめる（" + STATE.filter + "）";
      clr.onclick = function () { STATE.filter = ""; render(); };
      chips.appendChild(clr);
    }
    kinds.forEach(function (k) {
      var c = el("button", "chip");
      c.type = "button";
      c.textContent = k;
      c.onclick = function () { STATE.filter = k; render(); };
      chips.appendChild(c);
    });
    v.appendChild(chips);

    /* まだのものを上に、押したものを下に。上から順に片づく形にする */
    var yet = [], sumi = [];
    g.cards.forEach(function (c, i) {
      if (STATE.filter) {
        var hay = (c.kind + c.title + c.what + c.who).toLowerCase();
        if (hay.indexOf(STATE.filter.toLowerCase()) < 0) return;
      }
      (STATE.done[cardKey(i)] ? sumi : yet).push([c, i]);
    });

    if (!yet.length && !sumi.length) {
      v.appendChild(el("div", "empty",
        '<span class="big">見つかりませんでした</span>' +
        "書いた言葉に当てはまる下書きは、今日はありません。"));
      return v;
    }

    if (yet.length) {
      var s1 = el("div", "stack");
      yet.forEach(function (p) { s1.appendChild(buildCard(p[0], p[1])); });
      v.appendChild(s1);
    } else {
      v.appendChild(el("div", "empty",
        '<span class="big">今日のぶんは終わりました</span>' +
        "残っている決めごとはありません。"));
    }

    if (sumi.length) {
      v.appendChild(el("div", "stack-head", "押した札　" + sumi.length + "件"));
      var s2 = el("div", "stack");
      s2.style.marginTop = "14px";
      sumi.forEach(function (p) { s2.appendChild(buildCard(p[0], p[1])); });
      v.appendChild(s2);
    }
    return v;
  }

  var RISK_LABEL = {
    gray:  "社内メモ・取り消せます",
    white: "社内で確定します",
    red:   "お金・社外に出ます"
  };

  function buildCard(c, i) {
    var key = cardKey(i);
    var done = !!STATE.done[key];
    var card = el("div", "card");
    card.setAttribute("data-risk", c.risk);
    card.setAttribute("data-done", done ? "1" : "0");

    var stamp = el("div", "stamp mincho", done ? "済<br>" + (c.risk === "red" ? "承認" : "確認") : "");
    card.appendChild(stamp);

    var top = el("div", "card-top");
    top.innerHTML =
      '<span class="tag">' + esc(c.kind) + "</span>" +
      '<span class="tag risk">' + esc(RISK_LABEL[c.risk] || "") + "</span>" +
      "<h3>" + esc(c.title) + "</h3>";
    card.appendChild(top);

    var four = el("dl", "four");
    /* 金額が入っていない業務（件数・時間・距離）に「いくら」と出ると読み手が止まるので、
       円が入っているかどうかでラベルを変える */
    var isMoney = /円|￥/.test(c.amount || "");
    var rows = [
      ["何を", c.what, ""],
      [isMoney ? "いくら" : "どれだけ", c.amount, isMoney ? "money" : ""],
      ["誰に", c.who, ""],
      ["いつまでに", c.when, ""]
    ];
    rows.forEach(function (r) {
      if (!r[1]) return;
      four.appendChild(el("dt", null, r[0]));
      four.appendChild(el("dd", r[2] || null, esc(r[1])));
    });
    card.appendChild(four);

    var diff = el("div", "diff");
    diff.innerHTML =
      '<div class="from"><span class="cap">もとの書類</span>' + esc(c.before).replace(/\n/g, "<br>") + "</div>" +
      '<div class="to"><span class="cap">番頭の下書き</span>' + esc(c.after).replace(/\n/g, "<br>") + "</div>";
    card.appendChild(diff);

    var tr = el("ul", "trace");
    (c.trace || []).forEach(function (t, n) {
      var li = el("li", null, esc(t));
      li.setAttribute("data-n", ["①", "②", "③", "④"][n] || "・");
      if (n === 1) li.setAttribute("data-skip", "1");
      tr.appendChild(li);
    });
    card.appendChild(tr);

    if (c.needs_human) {
      card.appendChild(el("div", "need",
        "<b>ここは人が見てください：</b>" + esc(c.needs_human)));
    }

    var acts = el("div", "acts");
    if (done) {
      var undo = el("button", "btn sub");
      undo.type = "button";
      undo.textContent = "やっぱり戻す";
      undo.onclick = function () { delete STATE.done[key]; render(); };
      acts.appendChild(undo);
    } else {
      var ok = el("button", "btn go");
      ok.type = "button";
      ok.textContent = c.risk === "red" ? "確認しました。これで出す" : "これでOK";
      ok.onclick = function () { STATE.done[key] = true; render(); };
      acts.appendChild(ok);

      var fix = el("button", "btn sub");
      fix.type = "button";
      fix.textContent = "直す";
      fix.onclick = function () { toast("直す画面をひらきます（このデモでは中身までは動きません）"); };
      acts.appendChild(fix);

      var to = el("button", "btn sub");
      to.type = "button";
      to.textContent = "人に回す";
      to.onclick = function () { toast("担当の方へ回しました（このデモでは通知は飛びません）"); };
      acts.appendChild(to);
    }
    card.appendChild(acts);
    return card;
  }

  /* ==========================================================================
     ③ 受け口ボード
     ========================================================================== */
  var ST_LABEL = {
    connected:        "つながっています",
    csv:              "書き出したファイルで受け取り",
    pending_customer: "お客様側の手続き待ち",
    pending_us:       "当社で検証中",
    not_yet:          "まだつながっていません"
  };

  function viewPipes() {
    var g = G();
    var v = el("div", "page");
    v.appendChild(el("h1", "page-title",
      '<span class="serial">弐</span>' + esc(g.words.intake)));
    v.appendChild(el("p", "page-lead",
      "いま何がここへ入ってきているかの一覧です。つながっていない先も、そのまま出しています。"));

    var board = el("div", "board");
    g.intakes.forEach(function (p) {
      var b = el("button", "pipe");
      b.type = "button";
      b.setAttribute("data-st", p.status);
      b.innerHTML =
        '<span class="nm">' + esc(p.name) + "</span>" +
        '<span class="st">' + esc(ST_LABEL[p.status] || "") + "</span>" +
        '<span class="ct">' + (p.today_count
          ? "今日 <b class=\"num\">" + esc(p.today_count) + "</b>"
          : esc(p.note)) + "</span>";
      b.onclick = function () {
        var msg = p.note || "";
        if (p.customer_action) msg += "／お客様にお願いする操作：" + p.customer_action;
        toast(p.name + "：" + msg);
      };
      board.appendChild(b);
    });
    v.appendChild(board);

    var pend = g.intakes.filter(function (p) { return p.status !== "connected" && p.status !== "csv"; });
    if (pend.length) {
      var n = el("div", "note");
      n.innerHTML = "<b>灰色の受け口について。</b>ここは、まだつながっていない所です。" +
        "つなぐには " + pend.map(function (p) { return esc(p.name); }).join("・") +
        " について、お客様ご本人の手続き（連携の許可・鍵の発行など）が要ります。" +
        "当社がパスワードや鍵を代わりに入力することはしません。" +
        "手続きが終わるまでは、書き出したファイルと紙の写真で先に動かします。";
      v.appendChild(n);
    }
    return v;
  }

  /* ==========================================================================
     ④ 今月の1枚
     ========================================================================== */
  function viewReport() {
    var g = G();
    var m = g.monthly;
    var v = el("div", "page");
    v.appendChild(el("h1", "page-title",
      '<span class="serial">参</span>' + esc(g.words.report)));
    v.appendChild(el("p", "page-lead",
      "今月あなたが何件押したか、そして何が手作業で残ったか。数字はこのデモ用のサンプルです。"));

    var figs = el("div", "figs");
    [["番頭が作った下書き", m.drafts_count],
     ["あなたが押した数", m.approved_count],
     ["直しが入った数", m.fixed_count]].forEach(function (f) {
      /* データ側に「件」が入っていることがあるので、数字と単位を分けてから組む */
      var raw = String(f[1] == null ? "" : f[1]).trim();
      var mm = raw.match(/^([0-9,.]+)\s*(.*)$/);
      var val = mm ? mm[1] : raw;
      var unit = mm && mm[2] ? mm[2] : "件";
      var d = el("div", "fig");
      d.innerHTML =
        '<div class="k">' + esc(f[0]) + "</div>" +
        '<div class="v num">' + esc(val) + "<small>" + esc(unit) + "</small></div>";
      figs.appendChild(d);
    });
    v.appendChild(figs);

    var bars = el("div", "bars");
    var months = ["3月", "4月", "5月", "6月", "7月"];
    var base = parseInt(String(m.drafts_count).replace(/[^0-9]/g, ""), 10) || 60;
    months.forEach(function (mm, i) {
      var val = Math.round(base * (0.42 + i * 0.16));
      if (i === months.length - 1) val = base;
      var b = el("div", "bar");
      b.innerHTML =
        '<span class="m">' + mm + "</span>" +
        '<span class="t"><i style="width:' + Math.min(100, Math.round(val / base * 100)) + '%"></i></span>' +
        '<span class="n num">' + String(val).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + " 件</span>";
      bars.appendChild(b);
    });
    v.appendChild(bars);

    var t = el("table", "ledger");
    t.innerHTML =
      "<thead><tr><th>いつ</th><th>だれが</th><th>なにを</th><th>どうした</th></tr></thead><tbody></tbody>";
    var tb = t.querySelector("tbody");
    g.cards.slice(0, 5).forEach(function (c, i) {
      var tr = el("tr");
      tr.innerHTML =
        "<td class=\"num\">7/" + (28 - i) + "</td><td>あなた</td><td>" + esc(c.title) + "</td><td>" +
        (STATE.done[cardKey(i)] ? "押しました" : "まだ") + "</td>";
      tb.appendChild(tr);
    });
    v.appendChild(t);

    var r = el("div", "rest");
    r.innerHTML =
      '<div class="h">まだ手作業で残っていること</div>' +
      '<div class="b">' + esc(m.remaining_manual) + "</div>" +
      '<div class="s">' + esc(m.upsell_hint) + "</div>";
    v.appendChild(r);

    if (g.legal_notes && g.legal_notes.length) {
      var n = el("div", "note");
      n.innerHTML = "<b>正直に書いておきます。</b><br>" +
        g.legal_notes.map(function (x) { return "・" + esc(x); }).join("<br>");
      v.appendChild(n);
    }
    return v;
  }

  /* ==========================================================================
     ⑤ 設定／聞く
     ========================================================================== */
  function viewSetup() {
    var v = el("div", "page");
    v.appendChild(el("h1", "page-title", '<span class="serial">肆</span>設定'));
    v.appendChild(el("p", "page-lead", "画面をあなたの会社の言葉に合わせます。"));
    v.appendChild(gyoshuPicker());

    var n = el("div", "note");
    n.innerHTML =
      "<b>このデモについて。</b><br>" +
      "・出てくる会社名・金額・件数は、すべて架空のサンプルです。<br>" +
      "・押しても、実際にメールが飛んだり、お金が動いたりすることはありません。<br>" +
      "・" + esc(window.META.company) + " の導入実績は現在0社です。効果を保証するものではありません。<br>" +
      "・AIの処理は米国のAnthropic社に送信されます。手書き・FAXの読み取りだけは、お客様のパソコンの中だけで行います。";
    v.appendChild(n);
    return v;
  }

  function gyoshuPicker() {
    var wrap = el("div");
    wrap.appendChild(el("div", "lbl", "業種をえらぶと、画面の呼び名と中身が入れ替わります"));
    var pick = el("div", "gyoshu-pick");
    window.GYOSHU.forEach(function (g, i) {
      var b = el("button");
      b.type = "button";
      b.setAttribute("aria-pressed", i === STATE.gyoshu ? "true" : "false");
      b.innerHTML = '<span class="kanji">' + esc(g.icon || "業") + "</span><span>" + esc(g.label) + "</span>";
      b.onclick = function () {
        STATE.gyoshu = i;
        STATE.done = {};
        STATE.filter = "";
        autoPass();
        STATE.drawer = false;
        STATE.view = "box";
        render();
      };
      pick.appendChild(b);
    });
    wrap.appendChild(pick);
    return wrap;
  }

  function viewAsk() {
    var v = el("div", "page");
    v.appendChild(el("h1", "page-title", '<span class="serial">伍</span>気持ち市場に聞く'));
    v.appendChild(el("p", "page-lead",
      "分からないところは、番頭に無理をさせず人に聞いてください。画面と下書きを添えて当社に届きます。"));

    var n = el("div", "note");
    n.innerHTML =
      "<b>この商品の考え方。</b><br>" +
      "自動化は「全部まかせる」ことではなく、<b>まかせる範囲を決める</b>ことだと考えています。<br>" +
      "・いきなり全部はまかせません。まず1つの仕事から始めます。<br>" +
      "・最初の3回は、必ず出てきたものを一緒に確認します。<br>" +
      "・判断が要るものは、番頭が勝手に決めずに分けて出します。<br>" +
      "・お金・社外に出るもの・消すものは、いつでも人が押します。";
    v.appendChild(n);

    var box = el("div", "ask");
    box.style.marginTop = "22px";
    box.innerHTML =
      '<input type="text" placeholder="聞きたいことを書いてください" aria-label="質問">' +
      '<button type="button">この画面を添えて送る</button>';
    box.querySelector("button").onclick = function () {
      toast("このデモでは送信しません。実際の運用では、いま見ている画面と下書きを添えて当社に届きます。");
    };
    v.appendChild(box);
    return v;
  }

  /* ---------- ドロワー ---------- */
  function buildDrawer() {
    var veil = el("div", "veil");
    veil.onclick = function () { STATE.drawer = false; render(); };
    var d = el("aside", "drawer");
    d.appendChild(el("h2", null, "業種をえらぶ"));
    var s = el("section");
    s.appendChild(gyoshuPicker());
    d.appendChild(s);
    var c = el("button", "ghost");
    c.type = "button";
    c.textContent = "とじる";
    c.style.marginTop = "18px";
    c.onclick = function () { STATE.drawer = false; render(); };
    d.appendChild(c);
    var frag = document.createDocumentFragment();
    frag.appendChild(veil);
    frag.appendChild(d);
    return frag;
  }

  /* ---------- トースト ---------- */
  var toastTimer = null;
  function toast(msg) {
    var old = document.getElementById("toast");
    if (old) old.remove();
    var t = el("div", null, esc(msg));
    t.id = "toast";
    t.style.cssText =
      "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);" +
      "background:#0e1b2a;color:#f6f3ee;padding:14px 20px;max-width:min(560px,90vw);" +
      "font-size:14px;line-height:1.7;z-index:60;border-left:3px solid #c8934a";
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 4200);
  }

  /* ---------- 描画 ---------- */
  var VIEWS = { box: viewBox, pipes: viewPipes, report: viewReport, setup: viewSetup, ask: viewAsk };

  function go(id) {
    STATE.view = id;
    STATE.filter = "";
    if (id === "setup") STATE.drawer = false;
    if (location.hash.slice(1) !== id) {
      location.hash = id;   /* 商談でその画面を直接ひらけるように */
      return;               /* hashchange 側で描き直す */
    }
    render();
    window.scrollTo(0, 0);
  }

  function readHash() {
    var h = location.hash.slice(1).split("/");
    if (h[0] && VIEWS[h[0]]) STATE.view = h[0];
    if (h[1]) {
      for (var i = 0; i < window.GYOSHU.length; i++) {
        if (window.GYOSHU[i].id === h[1]) { STATE.gyoshu = i; break; }
      }
    }
  }

  function render() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    var shell = el("div", "shell");
    shell.appendChild(buildRail());
    var main = el("div", "main");
    main.appendChild(buildTop());
    main.appendChild((VIEWS[STATE.view] || viewBox)());
    shell.appendChild(main);
    root.appendChild(shell);
    if (STATE.drawer) root.appendChild(buildDrawer());
  }

  window.addEventListener("DOMContentLoaded", function () {
    if (!window.GYOSHU || !window.GYOSHU.length) {
      document.getElementById("app").innerHTML =
        '<div style="padding:40px">業種のデータが読み込めませんでした。</div>';
      return;
    }
    readHash();
    autoPass();
    render();
    window.addEventListener("hashchange", function () {
      readHash();
      render();
      window.scrollTo(0, 0);
    });
  });

  window.__banto = { STATE: STATE, render: render, go: go };
})();

</script>
</body>
</html>
